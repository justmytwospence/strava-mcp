# strava-mcp: an MCP server over a complete DuckDB mirror of your Strava account.
#
#   cp .env.example .env         # fill in STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, MCP_BEARER_TOKEN
#   docker compose run --rm -p 8765:8765 strava-mcp auth    # one-time Strava authorization
#   docker compose up -d         # the server alone: http://<host>:8000/mcp
#
# Optional, self-contained profiles (docker compose --profile <name> up -d):
#   oauth      agentgateway in front of /mcp as an OAuth 2.1 resource server (any OIDC provider)
#   grafana    Grafana with the DuckDB datasource and a provisioned dashboard over the snapshot
#   notebooks  a marimo notebook over the snapshot
#   backup     nightly archives of the tokens and the snapshot into ./backups
# Every variable is described in .env.example; the docs are at https://justmytwospence.github.io/strava-mcp/

services:
  strava-mcp:
    image: ghcr.io/justmytwospence/strava-mcp:4
    restart: unless-stopped
    # The whole .env is passed to the server, so every server variable it names (see
    # .env.example) applies without being listed here. The entries below add the
    # required-variable checks and the image's defaults for an empty value.
    env_file:
      - path: .env
        required: false
    environment:
      STRAVA_CLIENT_ID: "${STRAVA_CLIENT_ID:?set STRAVA_CLIENT_ID in .env, from https://www.strava.com/settings/api}"
      STRAVA_CLIENT_SECRET: "${STRAVA_CLIENT_SECRET:?set STRAVA_CLIENT_SECRET in .env}"
      MCP_BEARER_TOKEN: "${MCP_BEARER_TOKEN:?set MCP_BEARER_TOKEN in .env, for example from openssl rand -hex 32}"
      STRAVA_SYNC: ${STRAVA_SYNC:-on}
      STRAVA_API_BASE: "${STRAVA_API_BASE:-https://www.strava.com/api/v3}"
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-384MB}
      DUCKDB_THREADS: ${DUCKDB_THREADS:-2}
    volumes:
      # The mirror (strava.duckdb), its snapshot (snapshot/strava.duckdb) and tokens.json.
      - strava-data:/data
    ports:
      - "${STRAVA_MCP_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          # Measured: under 500 MB on a 2,000-activity mirror with DUCKDB_MEMORY_LIMIT=384MB.
          # The first start after upgrading from 3.x converts the mirror and needs more;
          # see the operations guide.
          memory: ${STRAVA_MCP_MEMORY:-1g}

  # --- profile: oauth -------------------------------------------------------------------
  # OAuth 2.1 resource server in front of /mcp: validates JWTs from your OIDC provider,
  # publishes /.well-known/oauth-protected-resource, and forwards to the server with the
  # backend bearer. Put your TLS reverse proxy in front of port 3000 at PUBLIC_URL.
  # OIDC_ISSUER, OIDC_JWKS_URL, OIDC_CLIENT_ID and PUBLIC_URL are all required for this
  # profile (agentgateway refuses to start without them); they are not marked required
  # here because compose interpolates inactive profiles too.
  oauth:
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    profiles: [oauth]
    restart: unless-stopped
    command: ["-f", "/etc/agentgateway/config.yaml"]
    depends_on:
      - strava-mcp
    environment:
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      # No default: every provider publishes its JWKS at a different path (see the
      # authentication guide). Find it as jwks_uri in <issuer>/.well-known/openid-configuration.
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-${OIDC_CLIENT_ID}}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      MCP_UPSTREAM: "http://strava-mcp:8000/mcp"
      MCP_BUFFER: ${MCP_BUFFER:-33554432}
    secrets:
      - source: mcp-bearer-token
        target: /run/secrets/backend-token
    volumes:
      - ./deploy/oauth/agentgateway.yaml:/etc/agentgateway/config.yaml:ro
    ports:
      - "${OAUTH_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 256m

  # --- profile: grafana -----------------------------------------------------------------
  # Grafana with the DuckDB datasource (MotherDuck's plugin, unsigned, needs the Ubuntu
  # image) reading the snapshot from the data volume, plus a provisioned dashboard.
  grafana:
    image: grafana/grafana:13.2.4-ubuntu
    profiles: [grafana]
    restart: unless-stopped
    depends_on:
      - strava-mcp
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: motherduck-duckdb-datasource
      GF_INSTALL_PLUGINS: "https://github.com/motherduckdb/grafana-duckdb-datasource/releases/download/v0.4.6/motherduck-duckdb-datasource-0.4.6.zip;motherduck-duckdb-datasource"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - strava-data:/data:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # Published on the loopback interface only: the default login is admin/admin. Set
    # GRAFANA_BIND=0.0.0.0 (and a real password) to reach it from other machines.
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"

  # --- profile: notebooks ---------------------------------------------------------------
  # A marimo notebook served read-only (marimo run) over the snapshot. It runs without
  # a token, so the port is published on the loopback interface only; set
  # MARIMO_BIND=0.0.0.0 to reach it from other machines, behind something that
  # authenticates.
  notebooks:
    image: ghcr.io/marimo-team/marimo:0.24.0-sql
    profiles: [notebooks]
    restart: unless-stopped
    depends_on:
      - strava-mcp
    command: ["marimo", "run", "--host", "0.0.0.0", "--port", "8080", "--headless", "--no-token", "/notebooks/strava.py"]
    environment:
      STRAVA_SNAPSHOT: /data/snapshot/strava.duckdb
    volumes:
      - strava-data:/data:ro
      - ./deploy/notebooks:/notebooks:ro
    ports:
      - "${MARIMO_BIND:-127.0.0.1}:${MARIMO_PORT:-2718}:8080"

  # --- profile: backup ------------------------------------------------------------------
  # Archives of tokens.json and the snapshot (never the live strava.duckdb, which the
  # server has open) into ./backups on a schedule, pruned by age.
  backup:
    image: offen/docker-volume-backup:v2.49.1
    profiles: [backup]
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "${BACKUP_CRON_EXPRESSION:-0 4 * * *}"
      BACKUP_FILENAME: strava-mcp-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: strava-mcp-
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # The live mirror and DuckDB's temporary files are left out; the snapshot is a
      # complete, consistent copy of it.
      BACKUP_EXCLUDE_REGEXP: '^/backup/strava/(strava\.duckdb(\.wal|\.tmp)?|duckdb-tmp(/.*)?|snapshot/[^/]*\.tmp)$'
    volumes:
      - strava-data:/backup/strava:ro
      - ${BACKUP_DIR:-./backups}:/archive

secrets:
  mcp-bearer-token:
    environment: MCP_BEARER_TOKEN

volumes:
  strava-data:
  grafana-data:
