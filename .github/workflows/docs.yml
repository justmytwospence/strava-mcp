# Build the documentation site on every push and pull request; publish it to GitHub Pages
# from main. Pages must be set to "GitHub Actions" as the source once, in the repository
# settings.
name: docs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: requirements-docs.txt
      # requirements-docs.txt pins the direct dependencies; the release cooldown holds back
      # fresh releases of everything they pull in.
      - run: uvx --with-requirements requirements-docs.txt mkdocs build --strict
        env:
          UV_EXCLUDE_NEWER: 7 days
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
