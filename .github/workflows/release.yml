# Push a vX.Y.Z tag to publish ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y and :X, create the
# GitHub Release with that version's CHANGELOG section as its notes, and publish the npm
# package with trusted publishing (no token: npm trusts this repository's workflow
# through the OIDC id-token, which must be registered once on npmjs.com under the
# package's "Trusted publisher" settings: owner, repository and release.yml).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run docs:gen
      - run: git diff --exit-code -- docs/reference/tools.md docs/data/schema.md

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      # The notes are the tag's section of CHANGELOG.md; a missing section fails the job.
      - run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > /tmp/notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    needs: image
    runs-on: ubuntu-latest
    # Until the trusted publisher is registered on npmjs.com this job fails; the image
    # and the GitHub Release must not depend on it.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; pin one rather than trust the
      # version the runner's Node happens to bundle.
      - run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      # The tag must match package.json, or the wrong version would be published.
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
