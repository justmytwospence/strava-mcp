site_name: strava-mcp
site_description: An MCP server over a complete DuckDB mirror of your Strava account, self-hosted with Docker Compose.
site_url: https://justmytwospence.github.io/strava-mcp/
repo_url: https://github.com/justmytwospence/strava-mcp
repo_name: justmytwospence/strava-mcp
edit_uri: edit/main/docs/
copyright: MIT licensed. Not affiliated with Strava.

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Clients: clients.md
      - FAQ: faq.md
  - Configure:
      - Configuration: configuration.md
      - Authentication: authentication.md
  - Concepts:
      - How sync works: sync.md
      - The mirror and the snapshot: data/index.md
  - Integrations:
      - Grafana, notebooks, backups: extras.md
      - garmin-mcp and the export: integrations/garmin-mcp.md
  - Operate:
      - Operations: operations.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Tools, resources and prompts: reference/tools.md
      - Schema: data/schema.md
      - Export API: reference/export.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Paths are relative to the repository root, so docs/changelog.md can include CHANGELOG.md.
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/justmytwospence/strava-mcp
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@justmytwospence/strava-mcp
